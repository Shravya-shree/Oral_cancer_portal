<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Code - #{{ scan.id }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Arial, sans-serif; }
        .qr-card { max-width: 480px; margin: 50px auto; background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        .qr-box { background: #ffffff; border: 2px solid #e9ecef; border-radius: 12px; padding: 15px; display: inline-block; }
        .qr-img { width: 220px; height: 220px; object-fit: contain; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">🔬 AI Oral Health Screener</span>
            <a href="{{ url_for('result', scan_id=scan.id) }}" class="btn btn-sm btn-light">Back to Report</a>
        </div>
    </nav>

    <div class="container">
        <div class="qr-card">
            
            <h3 class="fw-bold text-dark mb-1">Diagnostic Report QR Code</h3>
            <p class="text-muted small mb-4">Scan ID: <strong>#{{ scan.id }}</strong> | Patient: <strong>{{ scan.patient_name }}</strong></p>

            <!-- QR Display Box -->
            <div class="qr-box shadow-sm my-2">
                <img src="{{ url_for('static', filename='uploads/' + scan.qr) }}" alt="Report QR Code" class="qr-img">
            </div>

            <p class="text-muted small mt-3 mb-4">
                Scanning this QR code using any smartphone camera will grant public access to verify this diagnostic report.
            </p>

            <!-- Action Buttons -->
            <div class="d-grid gap-2 col-11 mx-auto">
                <!-- Download Button -->
                <a href="{{ url_for('static', filename='uploads/' + scan.qr) }}" download="Oral_Scan_QR_#{{ scan.id }}.png" class="btn btn-primary btn-lg fs-6 fw-bold shadow-sm">
                    ⬇️ Download QR Code
                </a>

                <!-- Back Link -->
                <a href="{{ url_for('result', scan_id=scan.id) }}" class="btn btn-outline-secondary mt-2">
                    ⬅️ Return to Diagnostic Report
                </a>
            </div>

        </div>
    </div>

</body>
</html>
